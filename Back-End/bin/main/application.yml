spring:
  application:
    name: Busan-CityView

  # 활성 프로파일 기본값: local (운영 배포 시 -Dspring.profiles.active=prod 로 전환)
  profiles:
    active: local

  # 프로젝트 루트의 .env 파일에서 DB 접속 정보 로드 (실행 위치에 따라 둘 중 하나가 잡힘)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8030
  # JSON 요청 크기 제한 (security.md S2 3-4 — 쓰기 API 도입 대비 / DoS 방지)
  # 기본 2MB → 명시적으로 제한. 공간 데이터 bulk 업로드가 필요해지면 별도 엔드포인트에서 재정의.
  tomcat:
    max-swallow-size: 2MB
  servlet:
    multipart:
      max-file-size: 10MB    # 파일 업로드 도입 시 조정
      max-request-size: 10MB

# 관리 계정 — 인증 골격(security.md 3-3, B안)용. 평문 금지, BCrypt 해시만 주입 (.env)
# 미설정 시 로그인 불가(관리 계정 없음)일 뿐 기동은 정상 — 보호 API가 생기면 .env에 해시 필수
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:}

# 공통 로그 레벨 — SQL/바인딩 상세 로그는 프로파일별로 분리 (운영 노출 방지, V3)
logging:
  level:
    root: INFO
