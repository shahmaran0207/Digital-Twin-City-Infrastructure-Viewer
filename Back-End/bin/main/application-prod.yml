# 운영 프로파일 — 보안 하드닝 (security.md [13] 3-2 / V2·V3)
spring:
  jpa:
    hibernate:
      ddl-auto: validate    # 스키마 변경은 마이그레이션으로만, 앱이 운영 스키마를 바꾸지 못하게 (V2)
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 운영 로그: SQL/바인딩 미출력, root INFO 고정 (쿼리·파라미터 노출 방지 — V3)
logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql.BasicBinder: warn

# CORS 허용 오리진 — 운영 도메인은 환경변수로만 주입 (하드코딩 금지, V4)
# 미설정 시 기동 실패(fail-closed): 운영 도메인을 반드시 명시하게 강제
# 여러 개는 콤마로 구분 (예: https://a.com,https://b.com)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
